name: hamtdaa
description: Монгол хэлтэй болзоо, дурсамжийн апп.
publish_to: none
version: 0.1.0+1
environment:
  sdk: ^3.11.4
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  path_provider: 2.1.6
  image_picker: 1.2.3
  url_launcher: 6.3.2
  supabase_flutter: 2.17.2
  crypto: 3.0.7
  flutter_secure_storage: 11.2.0
  archive: 4.3.0
  flutter_svg: 2.3.0
  flutter_local_notifications: 22.3.1
  timezone: 0.11.1
  share_plus: 13.3.0
  in_app_purchase: 3.3.1
  in_app_purchase_android: 0.5.0
  in_app_purchase_storekit: 0.4.13
  uuid: 4.6.0
  http: 1.6.0
  image: 4.8.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: 6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/branding/
    - assets/maps/
  fonts:
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito.ttf
    - family: NotoSansSymbols2
      fonts:
        - asset: assets/fonts/NotoSansSymbols2-Regular.ttf
