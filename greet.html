<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Чамд цэцэг ирлээ 🌸</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0; min-height:100%;}
  body{
    font-family:'Nunito',system-ui,sans-serif;
    color:#4b2b3d;
    background:
      radial-gradient(760px 520px at 15% 6%, #ffe9ef 0%, transparent 55%),
      radial-gradient(680px 480px at 88% 12%, #f4ecff 0%, transparent 52%),
      linear-gradient(170deg,#fffaf6 0%, #fff5f7 58%, #fdf3fb 100%);
    display:flex;
    flex-direction:column;
    align-items:center;
    min-height:100vh;
    padding:20px 16px 28px;
  }

  /* ---------- floating petals ---------- */
  .petals{position:fixed; inset:0; overflow:hidden; pointer-events:none; z-index:0;}
  .petals i{
    position:absolute; top:-6vh;
    width:12px; height:16px; border-radius:60% 0 60% 0;
    background:var(--p,#ffc6d6); opacity:.55;
    animation:fall linear infinite;
  }
  @keyframes fall{
    0%{transform:translateY(-10vh) rotate(0deg); opacity:0;}
    12%{opacity:.6;}
    100%{transform:translateY(112vh) translateX(var(--dx,20px)) rotate(420deg); opacity:0;}
  }

  main{position:relative; z-index:1; width:100%; max-width:440px; margin:auto 0;}

  /* ---------- scenes ---------- */
  .scene{display:none; animation:rise .5s cubic-bezier(.2,.9,.3,1) both;}
  body[data-stage="sealed"] .scene-seal{display:block;}
  body[data-stage="letter"] .scene-letter{display:block;}
  @keyframes rise{from{opacity:0; transform:translateY(16px);} to{opacity:1; transform:none;}}

  /* ---------- sealed card ---------- */
  .seal-card{
    background:#fffdfc;
    border:1px solid #f6dfe7;
    border-radius:24px;
    padding:34px 26px 30px;
    text-align:center;
    box-shadow:0 30px 70px -40px rgba(120,50,85,.5);
  }
  .seal-flower{width:132px; margin:0 auto 6px; animation:sway 4.5s ease-in-out infinite;}
  .seal-flower svg{width:100%; height:auto; display:block;}
  @keyframes sway{0%,100%{transform:rotate(-3deg);} 50%{transform:rotate(3deg);}}
  .seal-to{
    font-family:'Caveat',cursive; font-weight:600;
    font-size:26px; color:#c2517e; margin:0 0 2px;
  }
  h1{
    font-family:'Caveat',cursive; font-weight:700;
    font-size:34px; line-height:1.2; margin:0 0 8px; color:#4b2b3d;
  }
  .seal-sub{margin:0 0 22px; font-size:14px; font-weight:700; color:#a4758c;}
  .btn{
    border:none; cursor:pointer;
    font-family:'Nunito',sans-serif; font-weight:800; font-size:15px;
    padding:14px 30px; border-radius:999px; color:#fff;
    background:linear-gradient(135deg,#ff8fae,#ef5b87);
    box-shadow:0 16px 30px -16px rgba(239,91,135,.85);
    transition:transform .16s ease, box-shadow .16s ease;
  }
  .btn:hover{transform:translateY(-2px);}
  .btn:active{transform:scale(.97);}
  .btn:disabled{opacity:.5; cursor:default; transform:none;}
  .btn.ghost{
    background:#fff; color:#d9527f;
    border:2px solid #ffd3e0; box-shadow:none;
  }

  /* ---------- bloom ---------- */
  .bloom{width:170px; margin:0 auto -14px; position:relative; z-index:2;}
  .bloom svg{width:100%; height:auto; display:block; filter:drop-shadow(0 16px 26px rgba(120,50,85,.22));}
  body[data-stage="letter"] .bloom{animation:bloomIn .9s cubic-bezier(.2,1.5,.4,1) both;}
  @keyframes bloomIn{
    0%{opacity:0; transform:scale(.3) rotate(-16deg);}
    60%{opacity:1;}
    100%{opacity:1; transform:scale(1) rotate(0);}
  }
  .bloom-name{
    text-align:center; margin:2px 0 12px;
    font-family:'Caveat',cursive; font-weight:600; font-size:24px; color:#b8517d;
  }

  /* ---------- letter paper ---------- */
  .paper{
    position:relative;
    border-radius:16px;
    padding:30px 26px 26px;
    background:var(--paper-bg,#fffdf6);
    color:var(--paper-ink,#4a3b2f);
    border:1px solid var(--paper-edge,#efe2cd);
    box-shadow:0 26px 60px -34px rgba(90,50,40,.55), 0 2px 0 rgba(255,255,255,.6) inset;
    animation:paperIn .7s cubic-bezier(.2,.9,.3,1) .28s both;
    overflow:hidden;
  }
  @keyframes paperIn{from{opacity:0; transform:translateY(26px) rotate(-1deg);} to{opacity:1; transform:none;}}
  .paper::before{
    content:''; position:absolute; inset:30px 22px 22px;
    background:repeating-linear-gradient(
      to bottom,
      transparent 0 33px,
      var(--paper-line,rgba(120,150,190,.22)) 33px 34px
    );
    pointer-events:none;
  }
  .paper > *{position:relative;}
  .paper-to,
  .paper-body,
  .paper-sign{
    font-family:'Caveat',cursive;
    font-weight:600;
    line-height:34px;
  }
  .paper-to{font-size:25px; margin:0 0 2px;}
  .paper-body{font-size:23px; white-space:pre-wrap; word-wrap:break-word; margin:0;}
  .paper-sign{font-size:23px; margin:20px 0 0; text-align:right; opacity:.85;}

  /* ---------- actions ---------- */
  .actions{display:flex; flex-direction:column; align-items:center; gap:10px; margin:20px 0 0;}
  .reply{
    display:none; width:100%; gap:8px; margin-top:4px;
  }
  .reply.on{display:flex;}
  .reply input{
    flex:1; min-width:0;
    font-family:'Caveat',cursive; font-size:21px;
    padding:11px 16px; border-radius:14px;
    border:1px solid #f0d4de; background:#fffdfd; color:#4b2b3d;
  }
  .reply input:focus{outline:none; border-color:#ef5b87; box-shadow:0 0 0 3px rgba(239,91,135,.14);}
  .sent-status{
    min-height:20px; margin:12px 0 0; text-align:center;
    font-size:14px; font-weight:800; color:#b8517d;
  }
  .thanks-note{
    margin:14px 0 0; padding:14px 16px;
    text-align:center; border-radius:16px;
    background:#fff6f9; border:1px dashed #ffcfdf;
    font-family:'Caveat',cursive; font-size:23px; color:#b8517d;
    display:none;
  }
  .thanks-note.on{display:block; animation:rise .4s ease both;}

  footer{
    position:relative; z-index:1;
    margin-top:26px; text-align:center;
    font-size:12px; font-weight:700; color:#b39aac;
  }
  footer a{color:#d9527f; text-decoration:none;}

  @media (max-width:400px){
    h1{font-size:30px;}
    .paper{padding:26px 20px 22px;}
    .paper-body{font-size:22px;}
  }
</style>
</head>
<body data-stage="sealed">
  <div class="petals" id="petals" aria-hidden="true"></div>

  <main>
    <section class="scene scene-seal">
      <div class="seal-card">
        <div class="seal-flower" id="sealFlower"></div>
        <p class="seal-to" id="sealTo">Танд</p>
        <h1>Чамд цэцэг ирлээ</h1>
        <p class="seal-sub">нэг товшилтоор нээгээрэй</p>
        <button class="btn" id="openBtn">Нээх 🌸</button>
      </div>
    </section>

    <section class="scene scene-letter">
      <div class="bloom" id="bloom"></div>
      <p class="bloom-name" id="bloomName"></p>

      <article class="paper" id="paper">
        <p class="paper-to" id="paperTo"></p>
        <p class="paper-body" id="paperBody"></p>
        <p class="paper-sign" id="paperSign"></p>
      </article>

      <div class="actions" id="actions">
        <button class="btn" id="thanksBtn">💗 Хүлээж авлаа</button>
        <div class="reply" id="replyBox">
          <input id="replyText" maxlength="120" placeholder="Богино хариу бичих…" />
          <button class="btn ghost" id="replySend">Илгээх</button>
        </div>
      </div>
      <p class="sent-status" id="sentStatus" aria-live="polite"></p>
      <p class="thanks-note" id="thanksNote">Хариу илгээгчид хүрлээ 💗</p>
    </section>
  </main>

  <footer>
    <a href="create.html">Bolzoo — өөрийн цэцэг + захидлаа илгээх 🌷</a>
  </footer>

<script src="assets/utils.js"></script>
<script src="assets/config.js"></script>
<script src="assets/api.js"></script>
<script src="assets/bolzoo-garden.js"></script>
<script>
(function(){
  "use strict";
  var $ = BolzooUtils.$;
  var G = BolzooGarden;

  var INVITE_ID = new URLSearchParams(window.location.search).get('id') || null;

  var CONFIG = { recipientName:'', senderName:'', flower:'rose', paper:'cream', specialLetter:'' };
  var IS_PREVIEW = false;

  /* ---------- hash config (create.html preview / линкэн доторх config) ---------- */
  (function(){
    try{
      var params = new URLSearchParams(window.location.hash.slice(1));
      if(params.get('p') === '1') IS_PREVIEW = true;
      var c = params.get('c');
      if(c){
        var json = decodeURIComponent(escape(atob(decodeURIComponent(c))));
        merge(JSON.parse(json));
      }
    }catch(e){}
  })();

  function merge(c){
    if(!c) return;
    for(var k in c){
      if(c[k] !== undefined && c[k] !== null && c[k] !== '') CONFIG[k] = c[k];
    }
  }

  function defaultLetter(){
    var to = CONFIG.recipientName ? CONFIG.recipientName + ' минь' : 'Чамд';
    return to + ', өнөөдөр чамайг санасандаа энэ цэцгийг илгээлээ.\n'
      + 'Өдөр бүр чинь энэ цэцэг шиг зөөлөн, дулаан байг ✿';
  }

  function render(){
    var flower = G.flower(CONFIG.flower);
    var paper  = G.paper(CONFIG.paper);
    var recip  = String(CONFIG.recipientName || '').trim();
    var sender = String(CONFIG.senderName || '').trim();
    var text   = String(CONFIG.specialLetter || '').trim() || defaultLetter();

    $('sealFlower').innerHTML = G.flowerSVG(flower.id);
    $('bloom').innerHTML = G.flowerSVG(flower.id);

    $('sealTo').textContent = recip ? (recip + ' минь') : 'Танд';
    $('bloomName').textContent = flower.name + (sender ? ' — ' + sender + '-ээс' : '');

    var p = $('paper');
    p.style.setProperty('--paper-bg', paper.bg);
    p.style.setProperty('--paper-ink', paper.ink);
    p.style.setProperty('--paper-line', paper.line);
    p.style.setProperty('--paper-edge', paper.edge);

    $('paperTo').textContent = recip ? (recip + ' минь,') : '';
    $('paperBody').textContent = text;
    $('paperSign').textContent = sender ? ('— ' + sender) : '';

    document.title = (sender ? sender + '-ээс ' : '') + (recip ? recip + '-д ' : '') + 'цэцэг 🌸';
  }

  /* ---------- floating petals ---------- */
  (function(){
    var host = $('petals');
    var tints = ['#ffc6d6','#ffd9e4','#f6dcff','#ffe4c9'];
    var html = '';
    for(var i = 0; i < 14; i++){
      html += '<i style="left:' + (Math.random() * 100).toFixed(1) + '%;'
           + '--p:' + tints[i % tints.length] + ';'
           + '--dx:' + ((Math.random() * 90) - 45).toFixed(0) + 'px;'
           + 'animation-duration:' + (11 + Math.random() * 9).toFixed(1) + 's;'
           + 'animation-delay:-' + (Math.random() * 12).toFixed(1) + 's;'
           + 'transform:scale(' + (0.7 + Math.random() * 0.9).toFixed(2) + ')"></i>';
    }
    host.innerHTML = html;
  })();

  /* ---------- stages ---------- */
  function openLetter(){
    document.body.setAttribute('data-stage', 'letter');
    window.scrollTo(0, 0);
  }
  $('openBtn').addEventListener('click', openLetter);

  /* ---------- хариу илгээх ---------- */
  var sent = false;
  async function sendResponse(note){
    if(sent) return;
    if(IS_PREVIEW || !INVITE_ID || !window.BolzooAPI){
      $('sentStatus').textContent = IS_PREVIEW ? '(preview — хариу илгээгдэхгүй)' : '';
      return;
    }
    sent = true;
    $('thanksBtn').disabled = true;
    $('sentStatus').textContent = '⏳ илгээж байна…';
    try{
      await BolzooAPI.saveResponse(INVITE_ID, {
        type: 'flower',
        reaction: '💗',
        note: note || '',
        flower: G.flower(CONFIG.flower).id,
        at: new Date().toISOString()
      });
      $('sentStatus').textContent = '';
      $('replyBox').classList.remove('on');
      $('thanksNote').classList.add('on');
      $('thanksNote').textContent = note
        ? 'Хариу илгээгдлээ 💗 «' + note + '»'
        : 'Хариу илгээгчид хүрлээ 💗';
    }catch(e){
      sent = false;
      $('thanksBtn').disabled = false;
      $('sentStatus').textContent = '❌ Илгээхэд алдаа гарлаа. Дахин оролдоно уу.';
    }
  }

  $('thanksBtn').addEventListener('click', function(){
    if($('replyBox').classList.contains('on')){
      sendResponse($('replyText').value.trim());
    } else {
      $('replyBox').classList.add('on');
      $('sentStatus').textContent = 'Хүсвэл богино хариу бичээд илгээгээрэй ✍️';
      $('replyText').focus();
    }
  });
  $('replySend').addEventListener('click', function(){
    sendResponse($('replyText').value.trim());
  });
  $('replyText').addEventListener('keydown', function(e){
    if(e.key === 'Enter') sendResponse($('replyText').value.trim());
  });

  // Preview үед болон id-гүй (зөвхөн hash-тай) линк дээр хариу хадгалах боломжгүй
  if(IS_PREVIEW || !INVITE_ID){
    $('actions').style.display = 'none';
  }
  if(IS_PREVIEW){
    openLetter();
  }

  render();

  /* ---------- backend-ээс config ачаалах ---------- */
  if(INVITE_ID && window.BolzooAPI){
    BolzooAPI.getInvite(INVITE_ID).then(function(rec){
      if(rec && rec.config){ merge(rec.config); render(); }
      BolzooAPI.markOpened(INVITE_ID);
    }).catch(function(e){ console.warn('Config fetch failed:', e); });
  }
})();
</script>
</body>
</html>
