<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Уучлаарай 🥺</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=Comfortaa:wght@500;600;700&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --coral:#ff8fa6; --coral-deep:#f76a8e; --coral-soft:#ffb3c0;
    --ink:#5a2a46; --muted:#9a6b84;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0; overflow-x:hidden;}
  body{
    min-height:100svh;
    padding:20px 14px 40px;
    font-family:'Nunito',system-ui,sans-serif;
    color:var(--ink);
    background:
      radial-gradient(900px 620px at 12% 6%, #ffe6d6 0%, transparent 52%),
      radial-gradient(820px 560px at 88% 12%, #ffdce8 0%, transparent 50%),
      radial-gradient(760px 640px at 50% 106%, #ece0ff 0%, transparent 55%),
      linear-gradient(158deg,#fff6ef 0%, #fff0f2 55%, #fdeef6 100%);
  }

  /* ---------- Хөвөгч зүрхнүүд ---------- */
  .bg{position:fixed; inset:0; z-index:0; pointer-events:none; overflow:hidden;}
  .fh{position:absolute; bottom:-40px; opacity:0; animation:floatUp linear forwards;}
  @keyframes floatUp{
    0%{opacity:0; transform:translateY(0) translateX(0) rotate(0deg);}
    12%{opacity:.75;}
    88%{opacity:.5;}
    100%{opacity:0; transform:translateY(-108svh) translateX(var(--drift,0)) rotate(28deg);}
  }

  /* ---------- Дугтуйны intro ---------- */
  .intro-overlay{
    position:fixed; inset:0; z-index:80;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:18px;
    background:linear-gradient(158deg,#fff6ef 0%,#fff0f2 55%,#fdeef6 100%);
    animation:introFadeIn .35s ease-out;
  }
  .intro-overlay.leaving{animation:introFadeOut .6s ease-in forwards;}
  @keyframes introFadeIn{from{opacity:0;} to{opacity:1;}}
  @keyframes introFadeOut{to{opacity:0; visibility:hidden;}}
  .envelope{
    position:relative; width:240px; height:164px;
    animation:envEnter .7s cubic-bezier(.2,.9,.25,1.05) both;
  }
  @keyframes envEnter{from{opacity:0; transform:translateY(26px) scale(.9);} to{opacity:1; transform:none;}}
  .env-body{
    position:absolute; inset:0; border-radius:9px;
    background:linear-gradient(160deg,var(--coral),var(--coral-deep));
    box-shadow:0 24px 48px -22px rgba(197,58,105,.6);
  }
  .env-flap{
    position:absolute; top:0; left:0; right:0; height:96px;
    background:linear-gradient(160deg,#ff9fb6,#f0688c);
    clip-path:polygon(0 0, 100% 0, 50% 100%);
    transform-origin:top center;
    animation:flapOpen .85s cubic-bezier(.4,.1,.2,1) .55s forwards;
    z-index:3;
  }
  @keyframes flapOpen{to{transform:rotateX(178deg); filter:brightness(.92);}}
  .env-letter{
    position:absolute; inset:14px 12px 12px 12px;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px;
    padding:12px; text-align:center;
    background:#fff; border-radius:5px;
    box-shadow:0 6px 18px -10px rgba(90,42,70,.5);
    opacity:0; transform:translateY(20px);
    animation:letterRise 1.05s cubic-bezier(.2,.9,.25,1) 1.15s forwards;
    z-index:2;
  }
  @keyframes letterRise{to{opacity:1; transform:translateY(-30px);}}
  .env-letter-title{font-family:'Caveat',cursive; font-weight:700; font-size:21px; color:var(--coral-deep); line-height:1.1;}
  .env-letter-sub{font-size:11px; font-weight:800; color:var(--muted); letter-spacing:.5px;}
  .intro-hint{
    padding:6px 14px; border-radius:999px;
    background:rgba(255,255,255,.7);
    font-size:12px; font-weight:700; color:var(--muted); letter-spacing:.4px;
    opacity:0; animation:hintFade 1s ease-in .9s forwards;
  }
  @keyframes hintFade{to{opacity:1;}}

  /* ---------- Stage ---------- */
  .stage{position:relative; z-index:1; width:min(430px,100%); margin:0 auto;}
  .progress{display:flex; justify-content:center; gap:9px; margin:0 0 16px;}
  .progress .dot{width:9px; height:9px; border-radius:50%; background:#f0dee6; transition:background .25s, transform .25s;}
  .progress .dot.on{background:var(--coral-deep); transform:scale(1.25);}

  .screen{display:none; animation:screenIn .45s cubic-bezier(.2,.9,.25,1) both;}
  .screen.active{display:block;}
  @keyframes screenIn{from{opacity:0; transform:translateY(16px);} to{opacity:1; transform:none;}}

  .card{
    padding:24px 20px 22px;
    border:1px solid rgba(255,210,224,.8);
    border-radius:26px;
    background:rgba(255,253,251,.9);
    backdrop-filter:blur(12px);
    box-shadow:0 26px 60px -34px rgba(105,39,78,.5);
  }

  /* ---------- Стикер (муур) ---------- */
  .sticker{
    display:flex; align-items:flex-end; justify-content:center;
    min-height:8px; margin:0 0 6px;
  }
  .sticker-img{
    width:min(196px,58%); height:auto; display:block;
    filter:drop-shadow(0 18px 26px rgba(120,60,90,.28));
    animation:stickerIn .7s cubic-bezier(.2,.9,.25,1.05) both, sway 5.5s ease-in-out 1s infinite;
  }
  .sticker-svg{width:132px; height:132px; animation:stickerIn .7s cubic-bezier(.2,.9,.25,1.05) both, sway 5.5s ease-in-out 1s infinite;}
  .sticker-svg svg{width:100%; height:100%; display:block;}
  @keyframes stickerIn{from{opacity:0; transform:translateY(20px) scale(.86);} to{opacity:1; transform:none;}}
  @keyframes sway{0%,100%{transform:rotate(-1.6deg);} 50%{transform:rotate(1.6deg);}}

  /* ---------- Захидлын цаас ---------- */
  .letter-paper{
    position:relative;
    padding:26px 22px 22px;
    border-radius:18px;
    border:1px solid rgba(190,150,170,.28);
    box-shadow:0 18px 40px -28px rgba(90,42,70,.55), inset 0 1px 0 rgba(255,255,255,.6);
    overflow:hidden;
  }
  /* Цаасны буланд эвхэгдсэн мэдрэмж */
  .letter-paper::after{
    content:""; position:absolute; right:0; bottom:0;
    width:34px; height:34px;
    background:linear-gradient(135deg, transparent 50%, rgba(0,0,0,.07) 50%, rgba(0,0,0,.045) 100%);
    border-radius:0 0 18px 0;
  }
  .letter-greet{
    font-family:'Caveat',cursive; font-weight:700;
    font-size:27px; line-height:1.2; margin:0 0 12px;
  }
  .letter-body{
    font-family:'Caveat',cursive; font-weight:600;
    font-size:20px; line-height:1.62;
    white-space:pre-wrap; word-wrap:break-word;
    margin:0;
  }
  .letter-sign{
    margin:18px 0 0; text-align:right;
    font-family:'Caveat',cursive; font-weight:700; font-size:22px;
    opacity:.88;
  }
  /* Дэвтэр/тор цаасны үед мөрөнд таарсан мөрийн өндөр */
  .letter-paper[data-paper="ruled"] .letter-body{line-height:30px; font-size:21px;}
  .letter-paper[data-paper="ruled"]{padding-left:44px;}

  .confess{
    display:grid; grid-template-columns:38px minmax(0,1fr); gap:12px; align-items:center;
    margin:0 0 16px; padding:13px 15px;
    border:1px solid rgba(255,196,214,.85);
    border-left:4px solid var(--coral-deep);
    border-radius:14px;
    background:linear-gradient(135deg,#fff7fa,#fff0f5);
    text-align:left;
  }
  .confess-icon{
    width:38px; height:38px; display:grid; place-items:center;
    border-radius:12px; background:#ffe3ec; font-size:20px;
  }
  .confess small{display:block; font-size:11px; font-weight:900; letter-spacing:.5px; text-transform:uppercase; color:var(--coral-deep); margin-bottom:2px;}
  .confess strong{display:block; font-size:14.5px; font-weight:800; line-height:1.35; color:#5a2a46;}

  h1{font-family:'Comfortaa',sans-serif; font-weight:700; font-size:25px; line-height:1.3; margin:0 0 8px; text-align:center;}
  .lead{margin:0 0 20px; text-align:center; font-size:14.5px; line-height:1.5; font-weight:700; color:var(--muted);}

  /* ---------- Товч ---------- */
  .btn{
    position:relative; overflow:hidden; border:none; cursor:pointer;
    font-family:'Nunito',sans-serif; font-weight:800; font-size:15px;
    padding:14px 24px; border-radius:999px; color:#fff;
    background:linear-gradient(135deg,var(--coral),var(--coral-deep));
    box-shadow:0 14px 28px -12px rgba(247,106,142,.62);
    transition:transform .18s cubic-bezier(.2,1.5,.4,1), box-shadow .18s ease;
  }
  .btn:hover{transform:translateY(-2px);}
  .btn:active{transform:scale(.96);}
  .btn:disabled{opacity:.45; cursor:not-allowed; transform:none;}
  .btn.wide{display:block; width:100%; margin-top:18px;}
  .btn.ghost{
    background:#fff; color:var(--coral-deep);
    border:2px solid var(--coral-soft); box-shadow:none;
  }
  .btn.big{font-size:17px; padding:16px 30px;}

  /* ---------- Амлалтын купон ---------- */
  .coupon{
    position:relative;
    display:grid; grid-template-columns:52px minmax(0,1fr); gap:14px; align-items:center;
    margin:0 0 12px; padding:15px 16px;
    border:1.5px dashed rgba(247,106,142,.55);
    border-radius:16px;
    background:linear-gradient(135deg,#fffdfb,#fff4f8);
    box-shadow:0 12px 28px -24px rgba(105,39,78,.55);
    text-align:left;
    animation:screenIn .5s cubic-bezier(.2,.9,.25,1) both;
  }
  /* Хажуугийн цоолбор — жинхэнэ купон шиг */
  .coupon::before, .coupon::after{
    content:""; position:absolute; top:50%; width:16px; height:16px;
    border-radius:50%; background:#fdf1f4; transform:translateY(-50%);
  }
  .coupon::before{left:-9px; box-shadow:inset -2px 0 3px -2px rgba(105,39,78,.3);}
  .coupon::after{right:-9px; box-shadow:inset 2px 0 3px -2px rgba(105,39,78,.3);}
  .coupon-icon{
    width:52px; height:52px; display:grid; place-items:center;
    border-radius:14px; background:#ffe8f0; font-size:26px;
  }
  .coupon small{display:block; font-size:10.5px; font-weight:900; letter-spacing:.6px; text-transform:uppercase; color:var(--coral-deep); margin-bottom:3px;}
  .coupon strong{display:block; font-size:15px; font-weight:800; line-height:1.35;}

  /* ---------- Уучлалын хэмжүүр ---------- */
  .meter-face{font-size:56px; line-height:1; text-align:center; margin:4px 0 6px; transition:transform .25s;}
  .meter-label{
    text-align:center; font-size:16px; font-weight:900; min-height:24px;
    color:var(--coral-deep); margin:0 0 18px;
  }
  .meter-wrap{padding:0 4px; margin-bottom:6px;}
  input[type=range].meter{
    -webkit-appearance:none; appearance:none;
    width:100%; height:14px; border-radius:999px; outline:none; cursor:pointer;
    background:linear-gradient(90deg,#ffb9c9 0%,#ff7ba4 var(--pct,50%),#f1e2ea var(--pct,50%),#f1e2ea 100%);
  }
  input[type=range].meter::-webkit-slider-thumb{
    -webkit-appearance:none; appearance:none;
    width:30px; height:30px; border-radius:50%;
    background:#fff; border:3px solid var(--coral-deep);
    box-shadow:0 6px 16px -6px rgba(247,106,142,.8); cursor:grab;
  }
  input[type=range].meter::-moz-range-thumb{
    width:30px; height:30px; border-radius:50%;
    background:#fff; border:3px solid var(--coral-deep);
    box-shadow:0 6px 16px -6px rgba(247,106,142,.8); cursor:grab;
  }
  .meter-ends{display:flex; justify-content:space-between; font-size:11px; font-weight:800; color:var(--muted); margin-top:8px;}

  textarea.reply{
    width:100%; min-height:82px; resize:vertical;
    margin-top:6px; padding:13px 15px;
    border:1px solid #ffd7e2; border-radius:14px;
    font-family:'Nunito',sans-serif; font-size:14.5px; font-weight:700;
    color:var(--ink); background:#fff;
  }
  textarea.reply:focus{outline:none; border-color:var(--coral-deep); box-shadow:0 0 0 3px rgba(247,106,142,.14);}
  .field-label{
    display:flex; align-items:center; gap:7px;
    margin:20px 2px 8px;
    font-size:12px; font-weight:900; letter-spacing:.5px;
    text-transform:uppercase; color:var(--coral-deep);
  }

  /* "Хараахан үгүй" зугтах товч */
  .roam{position:relative; height:56px; margin-top:14px;}
  .btn-no{
    position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
    border:2px solid #e7d7e0; border-radius:999px;
    padding:11px 20px; background:#fff;
    color:var(--muted); font-family:'Nunito',sans-serif; font-size:14px; font-weight:800;
    cursor:pointer;
    transition:left .32s cubic-bezier(.2,.9,.25,1), top .32s cubic-bezier(.2,.9,.25,1), transform .2s;
  }
  .btn-no:hover{color:#7d5c72;}
  .secret{min-height:20px; margin:10px 0 0; text-align:center; font-size:13px; font-weight:800; color:var(--muted);}

  /* ---------- Дууссан дэлгэц ---------- */
  .done-emoji{font-size:64px; line-height:1; text-align:center; margin:2px 0 10px; animation:pop .6s cubic-bezier(.2,1.5,.4,1) both;}
  @keyframes pop{from{opacity:0; transform:scale(.4);} to{opacity:1; transform:none;}}
  .done-note{margin:14px auto 0; max-width:320px; text-align:center; font-size:15px; line-height:1.5; font-weight:800; color:var(--muted);}
  .score-pill{
    display:inline-flex; align-items:center; gap:8px;
    margin:0 auto; padding:9px 18px; border-radius:999px;
    background:linear-gradient(135deg,#fff0f6,#ffe3ee);
    border:1px solid rgba(255,180,205,.8);
    font-size:14px; font-weight:900; color:var(--coral-deep);
  }
  .center{display:flex; justify-content:center;}
  .send-status{min-height:20px; margin:12px 0 0; text-align:center; font-size:13px; font-weight:800; color:var(--coral-deep);}
  .restart{
    display:block; margin:16px auto 0; border:0; background:none; cursor:pointer;
    color:var(--muted); font-family:'Nunito',sans-serif; font-size:13px; font-weight:800;
    text-decoration:underline; text-underline-offset:3px;
  }

  /* ---------- Дууны товч ---------- */
  .sound-dock{position:fixed; z-index:40; right:14px; bottom:14px;}
  .sound{
    display:inline-flex; align-items:center; gap:8px;
    padding:10px 16px; border:1px solid rgba(255,200,218,.9); border-radius:999px;
    background:rgba(255,255,255,.9); backdrop-filter:blur(8px);
    color:var(--coral-deep); font-family:'Nunito',sans-serif; font-size:13px; font-weight:800;
    cursor:pointer; box-shadow:0 12px 26px -18px rgba(105,39,78,.55);
  }
  .sound.playing{background:linear-gradient(135deg,var(--coral),var(--coral-deep)); color:#fff; border-color:transparent;}
  .yt-hidden{position:fixed; width:1px; height:1px; left:-9999px; top:-9999px; opacity:0; pointer-events:none;}

  @media (max-width:420px){
    body{padding:16px 10px 34px;}
    .card{padding:20px 15px 18px; border-radius:22px;}
    h1{font-size:22px;}
    .letter-body{font-size:19px;}
    .letter-greet{font-size:24px;}
    .sticker-img{width:min(170px,62%);}
  }
</style>
</head>
<body>

  <!-- Дугтуй нээгдэх intro -->
  <div class="intro-overlay" id="introOverlay">
    <div class="envelope">
      <div class="env-body"></div>
      <div class="env-letter">
        <div class="env-letter-title" id="introRecipient">Танд захидал</div>
        <div class="env-letter-sub">🥺 нээгээрэй 🥺</div>
      </div>
      <div class="env-flap"></div>
    </div>
    <div class="intro-hint">товшиж алгасах</div>
  </div>

  <div class="bg" id="bg"></div>
  <div id="ytHost" class="yt-hidden" aria-hidden="true"></div>

  <main class="stage">
    <div class="progress" id="progress">
      <span class="dot on"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span>
    </div>

    <!-- 1. Захидал -->
    <section class="screen active" data-screen="letter">
      <div class="card">
        <div class="sticker" id="stickerSlot"></div>
        <div class="confess" id="confessBox" style="display:none;">
          <div class="confess-icon">💔</div>
          <div>
            <small>Миний буруу</small>
            <strong id="confessText"></strong>
          </div>
        </div>
        <div class="letter-paper" id="letterPaper">
          <p class="letter-greet" id="letterGreet">Уучлаарай…</p>
          <p class="letter-body" id="letterBody"></p>
          <p class="letter-sign" id="letterSign" style="display:none;"></p>
        </div>
        <button class="btn wide" id="toPromise">Үргэлжлүүлэх →</button>
      </div>
    </section>

    <!-- 2. Амлалт -->
    <section class="screen" data-screen="promise">
      <div class="card">
        <h1>Би чамд амлаж байна 🤞</h1>
        <p class="lead">Үгээр биш, үйлдлээрээ нөхнө.</p>
        <div id="couponList"></div>
        <button class="btn wide" id="toAnswer">Ойлголоо →</button>
      </div>
    </section>

    <!-- 3. Хариу -->
    <section class="screen" data-screen="answer">
      <div class="card">
        <h1 id="answerTitle">Уучлах уу? 🥺</h1>
        <p class="lead">Зүгээр л үнэнээ хэлээрэй — би сонсоход бэлэн.</p>

        <div class="meter-face" id="meterFace">🙂</div>
        <p class="meter-label" id="meterLabel">Зөөлөрч байна</p>
        <div class="meter-wrap">
          <input type="range" class="meter" id="meter" min="0" max="100" step="1" value="50"
                 aria-label="Хэр их уучилсан бэ" />
          <div class="meter-ends"><span>😾 огт үгүй</span><span>бүрэн уучлаа 😻</span></div>
        </div>

        <div class="field-label"><span>✍️</span>Хэлэх үг байвал (заавал биш)</div>
        <textarea class="reply" id="replyText" maxlength="300" placeholder="жишээ: дараагийн удаа ярилцаж шийдье…"></textarea>

        <button class="btn wide big" id="forgiveBtn">Уучлаа 💗</button>
        <div class="roam" id="roam"><button class="btn-no" id="notYetBtn" type="button">хараахан үгүй…</button></div>
        <p class="secret" id="secretMsg" aria-live="polite"></p>
      </div>
    </section>

    <!-- 4. Дууссан -->
    <section class="screen" data-screen="done">
      <div class="card">
        <div class="done-emoji" id="doneEmoji">😻</div>
        <h1 id="doneTitle">Баярлалаа 💗</h1>
        <div class="center"><span class="score-pill" id="scorePill"></span></div>
        <p class="done-note" id="doneNote"></p>
        <div class="send-status" id="sendStatus" aria-live="polite"></div>
        <button class="restart" id="restart" type="button">эхнээс нь үзэх 🔁</button>
      </div>
    </section>

    <div class="sound-dock">
      <button class="sound" id="sound" aria-label="Хөгжим тоглуулах" aria-pressed="false">
        <span class="sound-icon" id="soundIcon">🎵</span>
        <span class="sound-copy" id="soundText">дуу асаах</span>
      </button>
    </div>
  </main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
<script src="assets/utils.js"></script>
<script src="assets/config.js"></script>
<script src="assets/api.js"></script>
<script src="assets/bolzoo-cat.js"></script>
<script src="assets/bolzoo-paper.js"></script>
<script src="assets/bolzoo-sticker.js"></script>
<script src="assets/bolzoo-audio.js"></script>
<script>
(function(){
  "use strict";
  var $ = BolzooUtils.$;
  var esc = BolzooUtils.esc;

  /* ================= CONFIG ================= */
  var THEMES = {
    coral:    { coral:'#ff8fa6', coralDeep:'#f76a8e', coralSoft:'#ffb3c0' },
    lavender: { coral:'#c9b6e4', coralDeep:'#8e6dcf', coralSoft:'#d9c9f0' },
    peach:    { coral:'#ffb38a', coralDeep:'#f78e5a', coralSoft:'#ffd0b3' },
    mint:     { coral:'#8ed7c1', coralDeep:'#4fb99f', coralSoft:'#b9e6d7' },
    sky:      { coral:'#8ec5ff', coralDeep:'#5b9bff', coralSoft:'#b3d4ff' },
    sunset:   { coral:'#ffb066', coralDeep:'#e75d5d', coralSoft:'#ffc99d' },
    galaxy:   { coral:'#b19cff', coralDeep:'#6b47d9', coralSoft:'#cfc0ff' },
    aurora:   { coral:'#7ee1c0', coralDeep:'#4b9bcf', coralSoft:'#b8ecdc' }
  };

  function extractYouTubeId(v){
    if(!v) return '';
    v = String(v).trim();
    if(/^[a-zA-Z0-9_-]{11}$/.test(v)) return v;
    var m = v.match(/(?:v=|youtu\.be\/|embed\/|shorts\/)([a-zA-Z0-9_-]{11})/);
    return m ? m[1] : '';
  }

  var INVITE_ID = new URLSearchParams(window.location.search).get('id') || null;
  var DEFAULT_VIDEO = 'qsPzEsxyzB8';   // илгээгч дуу сонгоогүй үеийн үндсэн ая

  var CONFIG = (function(){
    var defaults = {
      mode: 'sorry',
      recipientName: '',
      senderName: '',
      responseEmail: '',
      videoId: DEFAULT_VIDEO,
      theme: 'coral',
      paper: 'cream',
      sticker: 'roses',
      sorryReason: '',
      sorryLetter: '',
      promises: [],
      customNote: ''
    };
    try{
      var params = new URLSearchParams(window.location.hash.slice(1));
      var c = params.get('c');
      if(c){
        var json = decodeURIComponent(escape(atob(decodeURIComponent(c))));
        var decoded = JSON.parse(json);
        for(var k in decoded){
          if(decoded[k] !== undefined && decoded[k] !== null && decoded[k] !== ''){ defaults[k] = decoded[k]; }
        }
      }
    }catch(e){}
    return normalize(defaults);
  })();

  function normalize(c){
    var yt = extractYouTubeId(c.videoId);
    c.videoId = yt || DEFAULT_VIDEO;
    if(!THEMES[c.theme]) c.theme = 'coral';
    if(!BolzooPaper.PAPERS[c.paper]) c.paper = 'cream';
    if(!BolzooSticker.STICKERS[c.sticker]) c.sticker = 'roses';
    if(!Array.isArray(c.promises)) c.promises = [];
    return c;
  }

  function mergeIntoConfig(c){
    if(!c) return;
    for(var k in c){
      if(c[k] !== undefined && c[k] !== null && c[k] !== ''){ CONFIG[k] = c[k]; }
    }
    normalize(CONFIG);
  }

  /* ================= Агуулга буулгах ================= */
  function applyTheme(){
    var t = THEMES[CONFIG.theme];
    var r = document.documentElement.style;
    r.setProperty('--coral', t.coral);
    r.setProperty('--coral-deep', t.coralDeep);
    r.setProperty('--coral-soft', t.coralSoft);
  }

  // Мэндчилгээг дээд мөр аль хэдийн хэлсэн тул энд давтахгүй
  function defaultLetter(){
    return [
      'Би чамайг гомдоосон гэдгээ мэдэж байна.',
      'Шалтаг хэлэх гэсэнгүй — зүгээр л уучлал гуйя гэсэн юм.',
      '',
      'Чиний сэтгэл надад юунаас ч илүү үнэтэй.',
      'Надад дахин нэг боломж өгөөч 🥺'
    ].join('\n');
  }

  function applyContent(){
    applyTheme();

    // Стикер (муур)
    $('stickerSlot').innerHTML = BolzooSticker.html(CONFIG.sticker);

    // Цаасны текстур
    var paper = $('letterPaper');
    BolzooPaper.apply(paper, CONFIG.paper);

    $('letterGreet').textContent = CONFIG.recipientName
      ? 'Уучлаарай ' + CONFIG.recipientName + ' минь,'
      : 'Уучлаарай…';
    $('letterBody').textContent = CONFIG.sorryLetter || defaultLetter();

    var sign = $('letterSign');
    if(CONFIG.senderName){
      sign.textContent = '— ' + CONFIG.senderName;
      sign.style.display = 'block';
    } else {
      sign.style.display = 'none';
    }

    // Гэм буруугаа хүлээсэн хэсэг
    var confess = $('confessBox');
    if(CONFIG.sorryReason){
      $('confessText').textContent = CONFIG.sorryReason;
      confess.style.display = 'grid';
    } else {
      confess.style.display = 'none';
    }

    // Амлалтууд
    renderPromises();

    if(CONFIG.recipientName){
      $('introRecipient').textContent = CONFIG.recipientName + ' минь';
      $('answerTitle').textContent = CONFIG.recipientName + ' минь, уучлах уу? 🥺';
    }
    if(CONFIG.senderName){
      document.title = CONFIG.senderName + ' уучлал гуйж байна 🥺';
    }
  }

  var PROMISE_ICONS = ['🍰','🎬','🌷','🍜','📵','🎁','☕','🚗','🧸','💐'];

  function renderPromises(){
    var list = $('couponList');
    var items = CONFIG.promises.filter(function(p){ return String(p||'').trim(); });
    if(!items.length){
      // Амлалт байхгүй бол тэр дэлгэцийг алгасна
      list.innerHTML = '';
      hasPromises = false;
      return;
    }
    hasPromises = true;
    var html = '';
    items.forEach(function(p, i){
      html += '<div class="coupon" style="animation-delay:' + (i * 0.09) + 's">'
        + '<div class="coupon-icon">' + PROMISE_ICONS[i % PROMISE_ICONS.length] + '</div>'
        + '<div><small>Амлалт ' + (i + 1) + '</small><strong>' + esc(p) + '</strong></div>'
        + '</div>';
    });
    list.innerHTML = html;
  }

  var hasPromises = false;

  applyContent();

  /* Backend-с config татах (?id=xxx) */
  if(INVITE_ID && window.BolzooAPI){
    BolzooAPI.getInvite(INVITE_ID).then(function(rec){
      if(rec && rec.config){
        mergeIntoConfig(rec.config);
        applyContent();
      }
      // defer горимд player-ыг энд үүсгэнэ (config ирсний дараа зөв дуугаар)
      if(audio && audio.setVideoId){ audio.setVideoId(CONFIG.videoId); }
      BolzooAPI.markOpened(INVITE_ID);
    }).catch(function(e){
      console.warn('Config fetch failed:', e);
      // Татаж чадаагүй ч дуу нь дүлий үлдэхгүй байх ёстой
      if(audio && audio.setVideoId){ audio.setVideoId(CONFIG.videoId); }
    });
  }
  /* ================= /CONFIG ================= */

  /* ---------- Дэлгэц солих ---------- */
  var order = ['letter','promise','answer','done'];
  var state = { screen:'letter', level:50, dodges:0 };

  function setProgress(i){
    var dots = $('progress').children;
    for(var k = 0; k < dots.length; k++){
      dots[k].className = 'dot' + (k === i ? ' on' : '');
    }
  }
  function goTo(name){
    state.screen = name;
    var secs = document.querySelectorAll('.screen');
    for(var i = 0; i < secs.length; i++){
      secs[i].classList.toggle('active', secs[i].getAttribute('data-screen') === name);
    }
    setProgress(order.indexOf(name));
    window.scrollTo(0, 0);
  }

  /* ---------- Уучлалын хэмжүүр ---------- */
  var LEVELS = [
    { max:15,  face:'😿', label:'Одоохондоо их гомдолтой' },
    { max:35,  face:'😾', label:'Бага зэрэг уурлаж байна' },
    { max:55,  face:'🙂', label:'Зөөлөрч байна' },
    { max:75,  face:'😊', label:'Бараг уучлах шахлаа' },
    { max:92,  face:'🥰', label:'Тэгье дээ, уучиллаа' },
    { max:100, face:'😻', label:'Бүрэн уучлаа! 💗' }
  ];
  function levelOf(v){
    for(var i = 0; i < LEVELS.length; i++){ if(v <= LEVELS[i].max) return LEVELS[i]; }
    return LEVELS[LEVELS.length - 1];
  }
  function updateMeter(){
    var v = Number($('meter').value);
    state.level = v;
    var lv = levelOf(v);
    var face = $('meterFace');
    face.textContent = lv.face;
    face.style.transform = 'scale(' + (0.94 + v / 500) + ')';
    $('meterLabel').textContent = lv.label;
    $('meter').style.setProperty('--pct', v + '%');
  }
  $('meter').addEventListener('input', function(){
    updateMeter();
    if(audio && audio.pop){ audio.pop(); }
  });
  updateMeter();

  /* ---------- Зугтах "хараахан үгүй" товч ---------- */
  var DODGE_MSGS = [
    'нэг л секунд… 🥺',
    'жаахан бодоод үзээч 🙏',
    'сүүлийн боломж…? 💗'
  ];
  var MAX_DODGE = 3;   // 3 удаагийн дараа товч зогсоно — хүнийг хавчихгүй

  $('notYetBtn').addEventListener('click', function(){
    if(state.dodges < MAX_DODGE){
      state.dodges++;
      var roam = $('roam'), btn = $('notYetBtn');
      var maxX = Math.max(0, roam.clientWidth - btn.offsetWidth);
      var x = Math.random() * maxX;
      btn.style.left = ((x / (roam.clientWidth || 1)) * 100) + '%';
      btn.style.top = (18 + Math.random() * 64) + '%';
      btn.style.transform = 'translate(0,-50%)';
      $('secretMsg').textContent = DODGE_MSGS[state.dodges - 1] || '';
      if(audio && audio.twinkle){ audio.twinkle(); }
      return;
    }
    // Хангалттай — хүсэл нь тодорхой бол хүндэтгэнэ
    finish(false);
  });

  $('forgiveBtn').addEventListener('click', function(){ finish(true); });
  $('toPromise').addEventListener('click', function(){
    if(audio && audio.pop){ audio.pop(); }
    goTo(hasPromises ? 'promise' : 'answer');
  });
  $('toAnswer').addEventListener('click', function(){
    if(audio && audio.pop){ audio.pop(); }
    goTo('answer');
  });

  /* ---------- Хариу хадгалах ---------- */
  function finish(forgiven){
    var level = forgiven ? Math.max(state.level, 50) : state.level;
    var reply = $('replyText').value.trim();

    $('doneEmoji').textContent = forgiven ? levelOf(level).face : '🫂';
    $('doneTitle').textContent = forgiven ? 'Баярлалаа 💗' : 'Ойлголоо, чи зөв';
    $('scorePill').textContent = '💗 Уучлалын хэмжүүр: ' + level + '%';
    $('doneNote').textContent = forgiven
      ? 'Чиний сэтгэл надад юунаас ч илүү үнэтэй. Үгээ биелүүлье 🤞'
      : 'Чамд цаг хэрэгтэй нь зөв. Би яарахгүй, хүлээж байя 🤍';

    goTo('done');
    if(forgiven){
      celebrate();
      if(audio && audio.chime){ audio.chime(); }
    }

    if(!INVITE_ID || !window.BolzooAPI){
      $('sendStatus').textContent = '(preview горим — хариу хадгалагдсангүй)';
      return;
    }
    $('sendStatus').textContent = '⏳ хариуг илгээж байна…';
    BolzooAPI.saveResponse(INVITE_ID, {
      type: 'sorry',
      forgiven: forgiven,
      level: level,
      reply: reply,
      at: new Date().toISOString()
    }).then(function(){
      $('sendStatus').textContent = '✅ Хариу илгээгдлээ';
    }).catch(function(e){
      $('sendStatus').textContent = '⚠️ Хадгалж чадсангүй: ' + (e.message || e);
    });
  }

  $('restart').addEventListener('click', function(){
    state.dodges = 0;
    $('secretMsg').textContent = '';
    var btn = $('notYetBtn');
    btn.style.left = '50%'; btn.style.top = '50%';
    btn.style.transform = 'translate(-50%,-50%)';
    goTo('letter');
  });

  /* ---------- Хөвөгч зүрх ---------- */
  var HEARTS = ['💗','💕','🤍','🌸','✨','💐'];
  var bg = $('bg');
  function spawnHeart(){
    var el = document.createElement('span');
    el.className = 'fh';
    el.textContent = HEARTS[(Math.random() * HEARTS.length) | 0];
    el.style.left = (Math.random() * 100) + '%';
    el.style.fontSize = (13 + Math.random() * 18) + 'px';
    var dur = 9 + Math.random() * 7;
    el.style.animationDuration = dur + 's';
    el.style.setProperty('--drift', ((Math.random() * 120) - 60) + 'px');
    bg.appendChild(el);
    setTimeout(function(){ el.remove(); }, dur * 1000 + 200);
  }
  for(var h = 0; h < 6; h++){ setTimeout(spawnHeart, h * 700); }
  setInterval(spawnHeart, 1600);

  function celebrate(){
    for(var i = 0; i < 26; i++){ setTimeout(spawnHeart, i * 70); }
  }

  /* ---------- Дугтуйны intro ---------- */
  (function(){
    var overlay = $('introOverlay');
    if(!overlay) return;
    var dismissed = false;
    function dismiss(){
      if(dismissed) return;
      dismissed = true;
      overlay.classList.add('leaving');
      setTimeout(function(){ overlay.style.display = 'none'; }, 600);
    }
    setTimeout(dismiss, 3200);
    overlay.addEventListener('click', dismiss);
    overlay.addEventListener('touchstart', dismiss, { passive:true });
  })();

  /* ---------- Дуу ---------- */
  var audio = BolzooAudio.init({
    videoId: CONFIG.videoId,
    buttonEl: $('sound'),
    iconEl: $('soundIcon'),
    textEl: $('soundText'),
    hostElId: 'ytHost',
    // ?id=xxx үед config ирэх хүртэл player үүсгэхгүй — үргэлж зөв дуугаар эхэлнэ
    deferPlayerCreation: !!INVITE_ID
  });
})();
</script>
</body>
</html>
