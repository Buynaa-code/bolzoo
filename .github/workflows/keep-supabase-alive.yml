name: Keep Supabase alive

on:
  schedule:
    # Даваа + Пүрэв 12:00 UTC (Улаанбаатарын цагаар 20:00) — 7 хоногийн inactivity pause-с сэргийлнэ
    - cron: '0 12 * * 1,4'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          curl -sf \
            -H "apikey: sb_publishable_arrXY92vzLxUIKrb5SKenQ_fM7Y7vKR" \
            "https://chmxjljudmwttwhemdri.supabase.co/rest/v1/access_codes?select=code&limit=1" \
            > /dev/null
          echo "Supabase ping OK"
